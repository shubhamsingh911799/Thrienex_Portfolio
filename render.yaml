services:
  - type: web
    name: thrienex-portfolio
    runtime: node
    plan: 0.5c-512mb
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/profile
    disk:
      name: portfolio-data
      mountPath: /opt/render/project/src/server/data
      sizeGB: 1
