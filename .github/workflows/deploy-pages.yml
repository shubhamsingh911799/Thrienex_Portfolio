name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - assets/**
      - index.html
      - profile-photo.png
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build static portfolio
        run: npm run build
        env:
          VITE_STATIC_SITE: true
          VITE_BASE_PATH: /Thrienex_Portfolio/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Publish built files to the Pages branch root
        run: |
          cp -R dist/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets profile-photo.png
          if git diff --cached --quiet; then
            echo "No built site changes to publish."
          else
            git commit -m "Deploy GitHub Pages site"
            git push
          fi
